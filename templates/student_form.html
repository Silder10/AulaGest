{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block page_heading %}{{ title }}{% endblock %}
{% block content %}<div class="section-intro"><div><p class="eyebrow">DIRECTORIO ACADÉMICO</p><h1>{{ title }}</h1><p class="muted">Los campos marcados son obligatorios.</p></div><a class="btn btn-secondary" href="{{ url_for('students') }}">← Volver</a></div>
<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Número de documento *<input name="document_number" required maxlength="30" value="{{ request.form.get('document_number', student.document_number if student else '') }}"></label>
<label>Correo electrónico *<input type="email" name="email" required maxlength="120" value="{{ request.form.get('email', student.email if student else '') }}"></label>
<label>Nombres *<input name="first_name" required maxlength="80" value="{{ request.form.get('first_name', student.first_name if student else '') }}"></label>
<label>Apellidos *<input name="last_name" required maxlength="80" value="{{ request.form.get('last_name', student.last_name if student else '') }}"></label>
<label>Teléfono<input name="phone" maxlength="30" value="{{ request.form.get('phone', student.phone if student and student.phone else '') }}"></label>
<label>Fecha de nacimiento<input type="date" name="birth_date" value="{{ request.form.get('birth_date', student.birth_date.isoformat() if student and student.birth_date else '') }}"></label>
<div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('students') }}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar estudiante</button></div></form></section>{% endblock %}
