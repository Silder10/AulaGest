{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block page_heading %}{{ title }}{% endblock %}
{% block content %}<div class="section-intro"><div><p class="eyebrow">OFERTA ACADÉMICA</p><h1>{{ title }}</h1></div><a class="btn btn-secondary" href="{{ url_for('courses') }}">← Volver</a></div><section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Código *<input name="code" required maxlength="20" value="{{ request.form.get('code', course.code if course else '') }}" placeholder="Ej. ADSO-101"></label>
<label>Nombre del curso *<input name="name" required maxlength="120" value="{{ request.form.get('name', course.name if course else '') }}"></label>
<label>Docente responsable *<input name="teacher_name" required maxlength="120" value="{{ request.form.get('teacher_name', course.teacher_name if course else '') }}"></label>
<label>Créditos *<input type="number" min="1" max="30" name="credits" required value="{{ request.form.get('credits', course.credits if course else 3) }}"></label>
<label class="full-field">Descripción<textarea name="description" rows="4" maxlength="3000">{{ request.form.get('description', course.description if course and course.description else '') }}</textarea></label>
<div class="form-actions"><a class="btn btn-secondary" href="{{ url_for('courses') }}">Cancelar</a><button class="btn btn-primary">Guardar curso</button></div></form></section>{% endblock %}
